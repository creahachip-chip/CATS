<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT - Creahachip Automated Trading System</title>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-panel: #131722;
            --bg-sidebar: #0f131a;
            --border-color: #232936;
            --text-primary: #e1e5ee;
            --text-muted: #788296;
            --accent-cyan: #00d2ff;
            --green: #089981;
            --green-hover: #067a67;
            --red: #f23645;
            --red-hover: #c92835;
            --orange: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            padding: 0 10px 24px 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .brand span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .nav-item {
            padding: 11px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background-color: #1a202c;
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: rgba(0, 210, 255, 0.12);
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
        }

        /* Main Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 18px 24px;
            gap: 16px;
        }

        /* Header */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .badge-demo {
            background-color: rgba(0, 210, 255, 0.15);
            color: var(--accent-cyan);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        /* Chart Section */
        .chart-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pair-info h2 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .pair-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .live-price-box {
            text-align: right;
        }

        .live-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--green);
            font-variant-numeric: tabular-nums;
        }

        .live-status {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #tvchart {
            width: 100%;
            height: 360px;
            border-radius: 6px;
            overflow: hidden;
        }

        /* Trade Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .indicators-info {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .indicators-info strong {
            color: var(--text-primary);
        }

        .trade-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .trade-amount {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            width: 110px;
            font-size: 0.9rem;
        }

        .btn {
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-buy { background-color: var(--green); }
        .btn-buy:hover { background-color: var(--green-hover); }

        .btn-sell { background-color: var(--red); }
        .btn-sell:hover { background-color: var(--red-hover); }

        .btn-sl { background-color: var(--orange); }
        .btn-sl:hover { opacity: 0.9; }

        /* Bottom Panels */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .panel-box {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .stat-row:last-child {
            border-bottom: none;
        }
